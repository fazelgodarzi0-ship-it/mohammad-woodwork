<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کارگاه نجاری محمد</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            direction: rtl;
            text-align: center;
            background: #f5f1eb;
            color: #3e2723;
        }

        header {
            background: #5d4037;
            color: white;
            padding: 30px;
        }

        h1 {
            margin: 0;
            font-size: 35px;
        }

        .box {
            background: white;
            margin: 40px auto;
            padding: 30px;
            max-width: 600px;
            border-radius: 15px;
        }

        button {
            background: #795548;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #4e342e;
        }

        footer {
            margin-top: 50px;
            background: #3e2723;
            color: white;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>کارگاه نجاری محمد</h1>
        <p>ساخت انواع محصولات چوبی با کیفیت</p>
    </header>

    <div class="box">
        <h2>به کارگاه محمد خوش آمدید</h2>

        <p>
            طراحی و ساخت محصولات چوبی،
            میز، صندلی، کمد و وسایل دکوراتیو
        </p>

        <button onclick="showMessage()">تماس با ما</button>
    </div>

    <footer>
        © 2026 کارگاه نجاری محمد
    </footer>

    <script>
        function showMessage() {
            alert("برای سفارش با کارگاه محمد تماس بگیرید.");
        }
    </script>

</body>
</html>
